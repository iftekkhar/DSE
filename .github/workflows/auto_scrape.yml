name: DSE Hourly Auto-Scraper (9AM - 6PM BST)

on:
  schedule:
    # Runs at minute 0 past every hour from 03:00 to 12:00 UTC (09:00 to 18:00 BST)
    - cron: '0 3-12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper
        run: |
          node -e "
            import('./server/index.js').then(async () => {
              console.log('Running automated scheduled scrape on GitHub Actions runner...');
            }).catch(err => {
              console.error('Runner error:', err);
              process.exit(1);
            });
          "
        env:
          TZ: 'Asia/Dhaka'

      - name: Ping Live Server (if deployed)
        if: env.LIVE_APP_URL != ''
        run: |
          curl -s -X POST "${{ secrets.LIVE_APP_URL }}/api/scrape" || echo "Live server ping completed"
        env:
          LIVE_APP_URL: ${{ secrets.LIVE_APP_URL }}

      - name: Commit & Push updated data (latest.json & history.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-scrape: updated DSE market snapshot [skip ci]" && git push)
