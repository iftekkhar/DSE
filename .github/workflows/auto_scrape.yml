name: DSE Market Hours Auto-Scraper (Sun-Thu 10AM - 3PM BST)

on:
  schedule:
    # Runs hourly during DSE trading hours: 04:00 to 09:00 UTC (10:00 AM to 03:00 PM BST), Sunday to Thursday
    - cron: '0 4-9 * * 0-4'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper
        run: |
          node -e "
            import('./server/index.js').then(async () => {
              console.log('Running automated scheduled scrape on GitHub Actions runner...');
            }).catch(err => {
              console.error('Runner error:', err);
              process.exit(1);
            });
          "
        env:
          TZ: 'Asia/Dhaka'

      - name: Ping Live Cloud Backend
        run: |
          curl -s -X POST "${{ secrets.LIVE_APP_URL || 'https://dse-xvn2.onrender.com' }}/api/scrape" || echo "Live backend ping completed"

      - name: Commit & Push updated data (latest.json & history.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-scrape: updated DSE market snapshot [skip ci]" && git push)
